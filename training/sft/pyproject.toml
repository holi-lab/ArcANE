[project]
name = "arcane"
version = "1.0.0"
description = "ArcANE SFT, DPO, and rollout utilities for chat models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "datasets>=4.0.0",
    "hatchling>=1.29.0",
    "omegaconf>=2.3.0",
    "peft>=0.17.0",
    "torch==2.9.1",
    "transformers<5.0.0",
    "trl>=1.2.0",
    "wandb>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["arcane"]
